services:
  - type: web
    name: backendreto2-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: ALLOWED_ORIGINS
        value: https://luzu1202.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: backendreto2-db
          property: connectionString
      - key: API_WRITE_KEY
        generateValue: true

databases:
  - name: backendreto2-db
    databaseName: backendreto2
    user: backendreto2_user
    plan: free
    region: oregon
